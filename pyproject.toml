[project]
name = "mvrce"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.1",
    "orjson>=3.11.5",
    "pytest>=9.0.2",
    "python-chess>=1.999",
    "pyyaml>=6.0.3",
    "requests>=2.32.5",
    "torch>=2.9.1",
    "torchaudio>=2.9.1",
    "torchvision>=0.24.1",
    "wandb>=0.24.0",
    "zstandard>=0.25.0",
]

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130"
priority = "explicit"

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }
